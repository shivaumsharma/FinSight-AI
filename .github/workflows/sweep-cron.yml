name: sweep-cron

# Replaces two in-process `while True: sleep(); ...` background
# threads that used to run inside app/api/main.py's FastAPI process.
# Cloud Run only allocates CPU to a container while it's actively
# handling a request by default -- a thread that needs to wake up and
# do work on its own, independent of any request, requires disabling
# that (--cpu-throttling=false), which bills the whole container for
# 24/7 wall-clock uptime instead of per-request. That's what actually
# drove this project's Cloud Run bill up (see the two /v1/internal/
# sweep/* endpoints in main.py) -- this workflow does the same two
# jobs on the same cadence, for free, from GitHub's own runners
# instead, so the backend never needs always-on CPU again.
#
# Requires one repo secret: FINSIGHT_API_KEY (the same value as the
# deployed backend's API_KEY env var -- Settings -> Secrets and
# variables -> Actions -> New repository secret).

on:
  schedule:
    # Timeout sweep: every 5 minutes (was 60s in-process -- a hung job
    # sitting a few minutes longer before being marked TIMEOUT is a
    # trivial cost, not worth a tighter cron schedule).
    - cron: "*/5 * * * *"
    # Call-outcome sweep: every 6 hours, matching the old thread's own
    # interval (checkpoints mature 7+ days out, so this was never
    # time-sensitive).
    - cron: "0 */6 * * *"
    # Rating-change sweep (Feature 2): every 15 minutes -- a genuine
    # rating flip only happens when a user's own research report
    # completes, so this isn't remotely as time-sensitive as the
    # timeout sweep, but a proactive suggestion sitting unsent for
    # hours would defeat the point of it being proactive.
    - cron: "*/15 * * * *"
    # Daily-briefing sweep (Feature 5): once a day. The endpoint itself
    # re-checks each user's own last_briefing_at (20h min interval, see
    # app/reasoning/daily_briefing.py) before sending anything, so this
    # cron time is just "roughly once a day," not a hard guarantee --
    # 13:00 UTC is arbitrary (no user-timezone concept exists in this
    # app yet to pick a real "morning" per user).
    - cron: "0 13 * * *"
  workflow_dispatch: {} # manual trigger, for testing this workflow itself

env:
  FINSIGHT_API_URL: https://s7cuvrl8j5.execute-api.eu-north-1.amazonaws.com

jobs:
  timeout-sweep:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: POST /v1/internal/sweep/timeouts
        run: |
          curl -sf -X POST "$FINSIGHT_API_URL/v1/internal/sweep/timeouts" \
            -H "X-API-Key: ${{ secrets.FINSIGHT_API_KEY }}"

  call-outcome-sweep:
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: POST /v1/internal/sweep/call-outcomes
        run: |
          curl -sf -X POST "$FINSIGHT_API_URL/v1/internal/sweep/call-outcomes" \
            -H "X-API-Key: ${{ secrets.FINSIGHT_API_KEY }}"

  rating-change-sweep:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: POST /v1/internal/sweep/rating-changes
        run: |
          curl -sf -X POST "$FINSIGHT_API_URL/v1/internal/sweep/rating-changes" \
            -H "X-API-Key: ${{ secrets.FINSIGHT_API_KEY }}"

  price-alert-sweep:
    # Reuses the timeout sweep's own every-5-minutes trigger (Feature 3)
    # rather than adding a third distinct cron line -- a price can cross
    # an alert's threshold at any moment during trading hours, so this
    # genuinely wants the tightest cadence already in this workflow, not
    # a new one.
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: POST /v1/internal/sweep/price-alerts
        run: |
          curl -sf -X POST "$FINSIGHT_API_URL/v1/internal/sweep/price-alerts" \
            -H "X-API-Key: ${{ secrets.FINSIGHT_API_KEY }}"

  daily-briefing-sweep:
    if: github.event.schedule == '0 13 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: POST /v1/internal/sweep/daily-briefings
        run: |
          curl -sf -X POST "$FINSIGHT_API_URL/v1/internal/sweep/daily-briefings" \
            -H "X-API-Key: ${{ secrets.FINSIGHT_API_KEY }}"
