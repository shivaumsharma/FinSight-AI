name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately NOT `pip install -r requirements.txt` -- that pulls
      # in torch/transformers/chromadb/llama-cpp-python (multi-GB, and
      # some of it needs a model download at runtime), none of which the
      # deterministic unit tests below touch. Installing only pandas/
      # numpy/langgraph + pytest keeps this workflow fast and keeps CI
      # from silently depending on network access to Hugging Face.
      # langgraph itself has no torch/chromadb dependency (see its own
      # requires: langchain-core, pydantic, xxhash -- verified via
      # `pip show langgraph`), so it's cheap to add here even though the
      # rest of the heavy stack stays excluded.
      # fastapi/httpx/yfinance/rapidfuzz/python-dotenv are also
      # lightweight (no torch/chromadb dependency) -- needed to import
      # app/api/main.py's chain: app.core.company_resolver (requests,
      # rapidfuzz), app.data.market_data.TickerNotFoundError (imported
      # lazily inside jobs.py's _run_job specifically so the rest of
      # this stays true), and app.reporting.narrative_builder's own
      # import of news_client.py (python-dotenv, for FINNHUB_API_KEY).
      # pywebpush (app.api.auth's VAPID push-notification support) and
      # joblib + scikit-learn (app.valuation.ml_valuation_classifier's
      # saved-model loader) are the same kind of lightweight, no-torch
      # dependency -- added after this list was first curated, which
      # silently broke every test module importing app.api.auth,
      # app.api.jobs, or (transitively, via phase2_backtest.py) the
      # rlvr training tests (ModuleNotFoundError at collection time)
      # until caught here. Verified against a truly isolated venv with
      # only this list installed, not just the (much more populated)
      # main dev venv -- that's what caught this exact gap.
      #
      # python-multipart (app.api.main's POST /v1/voice/transcribe,
      # FastAPI's own UploadFile/File(...) form parsing) and pypdf
      # (app.data.nse_filings_client's PDF text extraction) are the
      # same recurring gap -- both real requirements.txt dependencies
      # that this hand-curated list simply hadn't caught up with yet,
      # caught the same way as the pywebpush/joblib/scikit-learn gap
      # above: a collection-time ModuleNotFoundError/RuntimeError on
      # every test module importing app.api.main or
      # test_nse_filings_client.py.
      #
      # sarvamai (app.data.sarvam_realtime_client's wake-word relay,
      # imported at module load time by app.api.main) is the same
      # recurring gap again -- added to requirements.txt without a
      # matching update here, which broke collection for every test
      # module importing app.api.main (test_api.py, test_orders.py,
      # test_portfolio.py, test_watchlist.py) plus
      # test_sarvam_realtime_client.py itself. No torch/chromadb
      # dependency (it's a small HTTP/WebSocket client SDK), so it's
      # cheap to add here like every other entry in this list.
      #
      # xgboost/shap: same gap a fourth time. xgboost backs
      # ml_valuation_classifier.py's _LabelEncodedXGB (only defined
      # when HAS_XGBOOST is True) -- without it, unpickling the
      # committed valuation_classifier.joblib artifact raises
      # AttributeError at collection/fixture time for every test that
      # loads it (test_alpha_factors.py, test_valuation_tool.py,
      # test_ml_valuation_classifier.py), not just tests that train a
      # new model. shap is a deferred import inside
      # ml_evaluation.shap_importance_table() specifically (not a
      # module-level import, so a plain grep for "^import shap" misses
      # it) -- needed by test_ml_evaluation.py's SHAP-importance test.
      # mlflow is NOT added here: confirmed only imported by
      # scripts/train_ml_classifier.py (an on-demand training script),
      # which nothing under app/tests/ imports.
      #
      # reportlab: same recurring gap, a fifth time -- confirmed live
      # on the first real push after this session's own work, which is
      # exactly the "truly isolated venv" scenario the comment above
      # warns local testing can miss. app/reporting/pdf_report_builder.py
      # imports it at module level; test_pdf_report_builder.py (this
      # session's own addition) was the first test to ever import that
      # module, so nothing had caught the gap until then. No torch/
      # chromadb dependency -- pure Python, cheap to add.
      - name: Install test dependencies
        run: pip install pandas numpy langgraph==1.2.9 redis fastapi httpx yfinance rapidfuzz python-dotenv pywebpush joblib scikit-learn python-multipart pypdf sarvamai xgboost shap reportlab -r requirements-dev.txt

      # test_finbert.py is a manual smoke test (see its own docstring)
      # -- needs the full model stack and live network access (Hugging
      # Face), so it's excluded from CI and left for a developer to run
      # locally. test_rag.py used to be in the same category (a
      # __main__-gated script with zero real assertions, needing live
      # SEC EDGAR network access) but was rewritten to mock at
      # RAGPipeline's three constructor seams -- it's a real,
      # fast, no-network test file now, so it runs here like any other.
      # test_company_resolver.py belongs in the still-excluded category and was
      # missed when this exclusion list was first drawn up: it has zero
      # mocking and builds its US/NSE company indices from a genuinely
      # live fetch on every run (see company_resolver.py's
      # COMPANY_INDEX_CACHE/NSE_INDEX_CACHE, both gitignored -- there is
      # no committed snapshot for CI to load instead). Confirmed via a
      # CI annotation (2026-08-08) showing NSE fuzzy-name resolution
      # ("bajaj finance" -> BAJFINANCE.NS) returning [] specifically on
      # GitHub's runners while passing reliably from a local machine --
      # consistent with archives.nseindia.com blocking/throttling
      # requests from cloud-datacenter IP ranges, the same class of
      # issue already diagnosed for Yahoo Finance against Cloud Run
      # earlier this project (see market_movers.py's own docstring).
      # test_research_agent.py (this session's own addition) is
      # excluded for a different reason than the two above: it's fast
      # and mocks everything, but importing it imports
      # app/agents/research_agent.py, which -- unlike
      # app/agents/langgraph_agent.py's own deliberately-deferred
      # ToolRegistry import (see that module's own comment) -- pulls in
      # ToolRegistry at MODULE level, which pulls in SentimentTool ->
      # FinBERT -> transformers. That's exactly the multi-GB stack this
      # whole install list exists to avoid (see the top comment above),
      # so this test can't run here without contradicting this
      # workflow's own design -- confirmed live via the actual CI
      # failure (ModuleNotFoundError: transformers) this exclusion
      # fixes. Runs fine locally with the full dev environment; kept
      # for a developer to run there, same as test_finbert.py.
      #
      # Runs with --tb=short (not -x, so one CI round-trip surfaces
      # every failure, not just the first) and re-emits the actual
      # pytest output (not just its exit code) as a GitHub Actions error
      # annotation -- annotations are readable via the Checks API
      # without a signed-in session (unlike the raw log stream, which
      # now requires sign-in even on a public repo), which is what makes
      # a CI failure diagnosable at all without opening a browser.
      - name: Run unit tests
        run: |
          set +e
          pytest app/tests/ --ignore=app/tests/test_finbert.py --ignore=app/tests/test_company_resolver.py --ignore=app/tests/test_research_agent.py --tb=short 2>&1 | tee pytest_output.txt
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then
            summary=$(tail -150 pytest_output.txt | awk '{gsub(/%/,"%25"); gsub(/\r/,"%0D"); printf "%s%%0A", $0}')
            echo "::error::pytest failed (exit $exit_code):%0A$summary"
          fi
          exit $exit_code

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history -- the "changed files" diff below needs the prior commit/base SHA, not just the checked-out tip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # Repo-wide, warn-only: this codebase has a real backlog of
      # pre-existing lint findings (never gated before now), and a
      # blocking repo-wide pass on day one would demand a huge, unrelated
      # cleanup diff just to turn CI green. --exit-zero surfaces every
      # finding as a GitHub annotation without ever failing the build.
      - name: Lint (repo-wide, warn-only)
        run: ruff check . --output-format=github --exit-zero

      # Blocking, but ONLY on Python files THIS push/PR actually
      # touched -- ratchets the codebase toward clean incrementally:
      # new/changed code can't introduce a NEW lint violation, but
      # nothing here fails the build over a pre-existing finding in a
      # file nobody touched. base_sha resolution: a PR diffs against its
      # merge base; a push diffs against the commit it moved from
      # (github.event.before) -- both fall back to "lint nothing" (not
      # "lint everything") if that SHA isn't resolvable (e.g. the
      # repo's very first commit, or a force-push whose `before` SHA was
      # discarded), since failing the build over a diff CI can't
      # actually compute would be a false positive, not a real finding.
      - name: Determine changed Python files
        id: changed
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "${{ github.sha }}" -- '*.py' | tr '\n' ' ')
          else
            files=""
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Lint changed files (blocking)
        if: steps.changed.outputs.files != ''
        run: ruff check ${{ steps.changed.outputs.files }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      # Warn-only for now: confirmed live (pip-audit run against the real
      # image built from this exact requirements.txt) 30 known
      # vulnerabilities across 6 packages already exist today --
      # chromadb==0.4.24, protobuf==3.20.3 (both pre-existing pins this
      # session deliberately left alone), transformers, and base-image
      # tooling (pip/setuptools, upgraded by a base-image bump, not a
      # requirements.txt change). None are new; all need a maintainer's
      # triage (upgrade path, accepted risk, or version bump with its
      # own testing) before this can safely block a build. Flip to
      # blocking (drop `|| true`) once that triage happens. -r
      # requirements.txt audits declared deps directly from the file (no
      # install needed, unlike a full requirements.txt install in the
      # `pytest` job above, which is deliberately skipped for exactly
      # the reason explained there).
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt || true
