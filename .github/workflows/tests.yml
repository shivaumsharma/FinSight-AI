name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Deliberately NOT `pip install -r requirements.txt` -- that pulls
      # in torch/transformers/chromadb/llama-cpp-python (multi-GB, and
      # some of it needs a model download at runtime), none of which the
      # deterministic unit tests below touch. Installing only pandas/
      # numpy/langgraph + pytest keeps this workflow fast and keeps CI
      # from silently depending on network access to Hugging Face.
      # langgraph itself has no torch/chromadb dependency (see its own
      # requires: langchain-core, pydantic, xxhash -- verified via
      # `pip show langgraph`), so it's cheap to add here even though the
      # rest of the heavy stack stays excluded.
      # fastapi/httpx/yfinance/rapidfuzz/python-dotenv are also
      # lightweight (no torch/chromadb dependency) -- needed to import
      # app/api/main.py's chain: app.core.company_resolver (requests,
      # rapidfuzz), app.data.market_data.TickerNotFoundError (imported
      # lazily inside jobs.py's _run_job specifically so the rest of
      # this stays true), and app.reporting.narrative_builder's own
      # import of news_client.py (python-dotenv, for FINNHUB_API_KEY).
      # pywebpush (app.api.auth's VAPID push-notification support) and
      # joblib + scikit-learn (app.valuation.ml_valuation_classifier's
      # saved-model loader) are the same kind of lightweight, no-torch
      # dependency -- added after this list was first curated, which
      # silently broke every test module importing app.api.auth,
      # app.api.jobs, or (transitively, via phase2_backtest.py) the
      # rlvr training tests (ModuleNotFoundError at collection time)
      # until caught here. Verified against a truly isolated venv with
      # only this list installed, not just the (much more populated)
      # main dev venv -- that's what caught this exact gap.
      #
      # python-multipart (app.api.main's POST /v1/voice/transcribe,
      # FastAPI's own UploadFile/File(...) form parsing) and pypdf
      # (app.data.nse_filings_client's PDF text extraction) are the
      # same recurring gap -- both real requirements.txt dependencies
      # that this hand-curated list simply hadn't caught up with yet,
      # caught the same way as the pywebpush/joblib/scikit-learn gap
      # above: a collection-time ModuleNotFoundError/RuntimeError on
      # every test module importing app.api.main or
      # test_nse_filings_client.py.
      - name: Install test dependencies
        run: pip install pandas numpy langgraph==1.2.9 redis fastapi httpx yfinance rapidfuzz python-dotenv pywebpush joblib scikit-learn python-multipart pypdf -r requirements-dev.txt

      # test_finbert.py and test_rag.py are manual smoke tests (see
      # their own docstrings) -- they need the full model stack and
      # live network access (SEC EDGAR, Hugging Face), so they're
      # excluded from CI and left for a developer to run locally.
      # test_company_resolver.py belongs in that same category and was
      # missed when this exclusion list was first drawn up: it has zero
      # mocking and builds its US/NSE company indices from a genuinely
      # live fetch on every run (see company_resolver.py's
      # COMPANY_INDEX_CACHE/NSE_INDEX_CACHE, both gitignored -- there is
      # no committed snapshot for CI to load instead). Confirmed via a
      # CI annotation (2026-08-08) showing NSE fuzzy-name resolution
      # ("bajaj finance" -> BAJFINANCE.NS) returning [] specifically on
      # GitHub's runners while passing reliably from a local machine --
      # consistent with archives.nseindia.com blocking/throttling
      # requests from cloud-datacenter IP ranges, the same class of
      # issue already diagnosed for Yahoo Finance against Cloud Run
      # earlier this project (see market_movers.py's own docstring).
      # Runs with --tb=short (not -x, so one CI round-trip surfaces
      # every failure, not just the first) and re-emits the actual
      # pytest output (not just its exit code) as a GitHub Actions error
      # annotation -- annotations are readable via the Checks API
      # without a signed-in session (unlike the raw log stream, which
      # now requires sign-in even on a public repo), which is what makes
      # a CI failure diagnosable at all without opening a browser.
      - name: Run unit tests
        run: |
          set +e
          pytest app/tests/ --ignore=app/tests/test_finbert.py --ignore=app/tests/test_rag.py --ignore=app/tests/test_company_resolver.py --tb=short 2>&1 | tee pytest_output.txt
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then
            summary=$(tail -150 pytest_output.txt | awk '{gsub(/%/,"%25"); gsub(/\r/,"%0D"); printf "%s%%0A", $0}')
            echo "::error::pytest failed (exit $exit_code):%0A$summary"
          fi
          exit $exit_code
