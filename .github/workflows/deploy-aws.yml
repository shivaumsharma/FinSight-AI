name: deploy-aws

# Builds the backend image and deploys it to Elastic Beanstalk -- only runs
# once infra/ has been applied AND the AWS_DEPLOY_ROLE_ARN repo variable is
# set (from `terraform output github_actions_role_arn`, see infra/README.md).
# Missing/empty is expected and this whole workflow just no-ops until then --
# same gating pattern DigiNyaya's ci.yml already uses.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    permissions:
      id-token: write # required for AWS OIDC role assumption
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build & push backend image to ECR
        id: ecr_image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/finsight-backend:${{ github.sha }}"
          # ECR tags are immutable -- re-running this workflow for a commit
          # whose image was already pushed (e.g. manually re-triggering
          # after the EB deploy step below failed for an unrelated reason,
          # downstream of a successful push) would otherwise always fail
          # here with "tag invalid: ... already exists in the
          # 'finsight-backend' repository and cannot be overwritten".
          # Confirmed live 2026-08-21: exactly this, re-running for an
          # already-pushed commit after a hung EC2 instance broke the first
          # attempt's later steps. Checking first makes this step
          # idempotent -- reuse the existing image instead of erroring.
          if aws ecr describe-images --repository-name finsight-backend --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "Image already exists in ECR for this commit -- skipping build/push."
          else
            docker build -t "$IMAGE_URI" .
            docker push "$IMAGE_URI"
          fi
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Render Dockerrun.aws.json with the freshly-pushed image
        run: |
          sed "s|__ECR_IMAGE_URI__|${{ steps.ecr_image.outputs.uri }}|" \
            Dockerrun.aws.json > Dockerrun.aws.json.rendered
          mv Dockerrun.aws.json.rendered Dockerrun.aws.json

      # AWS's own official action, not the more popular third-party
      # einaregilsson/beanstalk-deploy -- that one has a known, unfixed
      # bug with OIDC-issued temporary credentials (fails with "AWS
      # Access Key not specified!" even though configure-aws-credentials
      # above already exported them; see
      # github.com/einaregilsson/beanstalk-deploy/issues/65 and #80).
      # Confirmed live: this is exactly what broke the first real deploy
      # attempt here. The official action reads credentials through the
      # normal AWS SDK chain (the same env vars), which actually works.
      - uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}
          application-name: ${{ vars.EB_APPLICATION_NAME || 'finsight' }}
          environment-name: ${{ vars.EB_ENVIRONMENT_NAME || 'finsight-backend-prod' }}
          version-label: ${{ github.sha }}
          deployment-package-path: Dockerrun.aws.json
          # Both already exist (created by infra/'s Terraform) -- never
          # let this action create a second, untracked copy alongside
          # them if a typo'd name ever mismatches.
          create-environment-if-not-exists: false
          create-application-if-not-exists: false
